archive:
  epsilon: 0.3
  ucb_c: 1.0
  selection_strategy: random
evolution:
  seed_programs_dir: seed_programs
  inner_iterations: 32
  inner_iteration_batch_size: 32
  num_rollouts: 5
  select_ignores_uncertainty: false
  select_ignores_variance: false
  verify_seeds: 5
  frontier_p_hat_range:
  - 0.0
  - 1.0
  fix_retry: false
  use_evaluator: true
  evaluator_provider: policy
training_data:
  instances_per_program: 8
  training_budget: null
  strict_anti_reuse: true
verl:
  enabled: true
  config_path: null
  reward_function: ./src/rq_evolve/reward.py:compute_score
  evolve_on_first_epoch: false
math_eval:
  enabled: true
  benchmarks:
  - math500
  - amc23
  - aime24
  - aime25
  - minerva_math
  - olympiadbench
  max_samples_per_benchmark: -1
  sample_seed: 42
  inflate_x32: false
  grader: sympy
async_rollout:
  streaming_enabled: true
  chunk_size: 1
  max_in_flight_chunks: 8
  request_timeout_s: 900
  max_retries: 1
  verify_workers: 4
  queue_maxsize: 32
  staleness_mode: bounded
  max_policy_lag: 1
  log_samples: true
  entropy_mode: deferred
lora:
  enabled: false
verl_config:
  data:
    max_prompt_length: 6000
    max_response_length: 5000
    train_batch_size: 32
    val_batch_size: 60000
    shuffle: true
    truncation: left
    dataloader_num_workers: 0
    filter_overlong_prompts: false
    trust_remote_code: true
  actor_rollout_ref:
    model:
      path: /data1/yhoon113/qwen3-4b-base
      trust_remote_code: true
      use_remove_padding: true
      enable_gradient_checkpointing: true
    actor:
      strategy: fsdp
      ppo_mini_batch_size: 32
      ppo_micro_batch_size: null
      ppo_micro_batch_size_per_gpu: 4
      use_dynamic_bsz: false
      entropy_from_logits_with_chunking: true
      use_kl_loss: true
      kl_loss_coef: 0.001
      kl_loss_type: low_var_kl
      use_torch_compile: false
      fsdp_config:
        param_offload: false
        optimizer_offload: false
      optim:
        lr: 1.0e-06
        weight_decay: 0.01
        lr_warmup_steps_ratio: 0.0
        total_training_steps: 128
    ref:
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 4
      fsdp_config:
        param_offload: true
    rollout:
      name: vllm
      mode: async
      temperature: 1.0
      top_p: 0.95
      n: 8
      tensor_model_parallel_size: 1
      checkpoint_engine:
        update_weights_bucket_megabytes: 4096
      gpu_memory_utilization: 0.45
      max_model_len: 12000
      max_num_batched_tokens: 12000
      dtype: bfloat16
      enable_chunked_prefill: true
      enforce_eager: false
      free_cache_engine: false
      enable_sleep_mode: false
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 4
  critic:
    ppo_mini_batch_size: 32
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 4
  reward_model:
    enable: false
    reward_manager: naive
  reward:
    custom_reward_function:
      path: ./src/rq_evolve/reward.py
      name: compute_score
    reward_manager:
      source: register
      name: naive
    reward_model:
      enable: false
  algorithm:
    adv_estimator: rloo
    use_kl_in_reward: false
    kl_penalty: low_var_kl
    norm_adv_by_std_in_grpo: true
  trainer:
    total_epochs: 10000
    total_training_steps: 128
    project_name: rq_evolve
    experiment_name: qwen3_4b_rq_evolve_nr5
    logger:
    - console
    - wandb
    nnodes: 1
    n_gpus_per_node: 8
    val_before_train: false
    test_freq: 32
    save_freq: 32
    # Keep ONE checkpoint on disk (see rq_evolve_base.yaml for the sizing).
    max_actor_ckpt_to_keep: 1
    max_critic_ckpt_to_keep: 1
    default_local_dir: ./rq_output/rq_evolve_4b_nr5
    device: cuda
    resume_mode: auto
  ray_init:
    num_cpus: null
