archive:
  selection_strategy: random

evolution:
  seed_programs_dir: seed_programs
  inner_iterations: 32
  inner_iteration_batch_size: 32
  group_size: 10
  train_batch_target: 32
  select_ignores_uncertainty: false
  select_ignores_variance: false
  verify_seeds: 5
  frontier_p_hat_range: [0.0, 1.0]
  fix_retry: false
  use_evaluator: false
  relabel_skill: true
  # Structural contract on the child's own cross-check, before execution.
  # Measured on 456 archived champions: 45% flagged, 0 of the 14 clean
  # programs. use_evaluator=false requires this to be shadow or enforce.
  ast_contract: enforce
  evaluator_provider: policy
  # NOT 0. The mutation prompt is a pure function of (operator, parent) and
  # sample_parent draws with replacement from a 10-16 champion archive, so
  # greedy decoding makes 36-49% of a batch byte-identical to something
  # already in it -- and identical children are rejected as duplicate_behavior,
  # so those slots yield nothing. 0.4 tightens instruction-following without
  # collapsing the batch.
  # Mutation runs in two calls: stage 1 writes the child PROBLEM in prose
  # with no program in front of it, stage 2 writes that problem's generator
  # with the parent shown only as a worked example of the statement-to-
  # program mapping. Measured against the single call that asked for a
  # mutated program: child/parent source similarity 0.99 -> 0.14, children
  # declaring their parent's own cell 96% -> 0%.
  two_stage_mutation: true
  # Stage 1 is invention and needs temperature; at 0 one parent yields one
  # child and a 32-slot batch collapses.
  code_temperature: 0.4
  code_top_p: 0.95
  # Stage 2 transcribes a fixed specification onto a fixed shape. There is
  # nothing to explore, and sampling only adds ways to mis-write it.
  generator_temperature: 0.0
  generator_top_p: 1.0
  # Output caps for the two mutation calls. Unset, both inherit
  # data.max_response_length (5000) -- the 4B 8-GPU run's stage-1/stage-2
  # replies had p50 171/301 tokens, so a runaway cost ~20x the median reply.
  # 2048 is the ceiling rq_output/gate_experiment ran stage 2 under, i.e. the
  # one every prompt-side measurement was taken at. See EvolutionConfig in
  # src/rq_evolve/config.py.
  family_max_output_tokens: 2048
  generator_max_output_tokens: 2048

training_data:
  # The training batch IS the re-scoring rollouts; there is no separate
  # sampling pass, so instances_per_program no longer applies.
  replay_training_batch: true
  instances_per_program: 8
  # Replay selection is a prompt-slot budget. Every incumbent is re-scored,
  # but only the 32 highest past-EWMA R_Q rows that are non-degenerate NOW can
  # enter this update. Keeping this explicit prevents dataloader shuffle from
  # turning an overfull (>32) frontier into random rather than R_Q priority.
  training_budget: 32
  strict_anti_reuse: true
  select_lowest_rq_first: false
  select_random_order: False
  select_random_seed: 0
  static_training_jsonl: null
  static_condition: null
  static_expected_rows: null
  static_expected_tokens: null
  static_epochs: 1

verl:
  enabled: true
  config_path: null
  reward_function: ./src/rq_evolve/reward.py:compute_score
  evolve_on_first_epoch: false

math_eval:
  enabled: true
  benchmarks: [math500, amc23, aime24, aime25, minerva_math, olympiadbench]
  max_samples_per_benchmark: -1
  sample_seed: 42
  inflate_x32: false
  grader: sympy

async_rollout:
  streaming_enabled: true
  chunk_size: 1
  # 32, not 8. At 8 this was the binding constraint on the run, not a margin:
  # max_pending_chunks read exactly 8 in all 243 iterations of the 4B 8-GPU run,
  # i.e. 80 sequences over 8 vLLM engines and 1,890 tok/s aggregate. See
  # AsyncRolloutConfig.max_in_flight_chunks in src/rq_evolve/config.py for the
  # concurrency/throughput measurement and the KV-cache budget behind 32.
  max_in_flight_chunks: 32
  request_timeout_s: 900
  max_retries: 1
  verify_workers: 4
  queue_maxsize: 32
  staleness_mode: bounded
  max_policy_lag: 1
  log_samples: true
  entropy_mode: deferred

lora:
  enabled: false
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  sync_mode: auto
  
verl_config:
  data:
    max_prompt_length: 6000
    max_response_length: 5000
    train_batch_size: 32
    val_batch_size: 60000
    shuffle: true
    truncation: left
    dataloader_num_workers: 0
    filter_overlong_prompts: false
    trust_remote_code: true

  actor_rollout_ref:
    model:
      path: /data1/yhoon113/qwen3-4b-base
      trust_remote_code: true
      use_remove_padding: true
      enable_gradient_checkpointing: true
      override_config:
        attn_implementation: "sdpa"
        _attn_implementation: "sdpa"

    actor:
      strategy: fsdp
      ppo_mini_batch_size: 32
      ppo_micro_batch_size: null
      # 4. verl normalises ppo_mini_batch_size by rollout.n, so the update sees
      # 32 x 10 = 320 sequences; on four ranks that is 80 per rank, and the
      # micro-batch decides how many accumulation steps it takes to walk them.
      # At 2 that was 40 steps and update_actor took 81.7s of a 131.8s step. At
      # 4 it is 20. Same gradient, same 32-prompt batch, half the passes.
      #
      # 8 does not fit: activations and the logits tensor (tokens x 151936)
      # scale with the micro-batch, and the step from 4 to 8 would add roughly
      # 10 GiB on top of a trainer already at ~51 GiB with the offload gone.
      ppo_micro_batch_size_per_gpu: 4
      use_dynamic_bsz: false
      # vLLM stays resident (enable_sleep_mode: false) holding ~36 GiB, leaving
      # <10 GiB for the actor forward. The unchunked entropy path materializes a
      # full (tokens x 151936) softmax and OOMs on long micro-batches; chunking
      # caps that at 2048 tokens at a time.
      entropy_from_logits_with_chunking: true
      use_kl_loss: true
      kl_loss_coef: 1.0e-3
      kl_loss_type: low_var_kl
      use_torch_compile: false
      fsdp_config:
        param_offload: false
        optimizer_offload: false
      optim:
        lr: 1.0e-6
        weight_decay: 1.0e-2
        lr_warmup_steps_ratio: 0.0
        total_training_steps: 256

    ref:
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 4
      fsdp_config:
        param_offload: true

    rollout:
      name: vllm
      mode: async
      temperature: 1.0
      top_p: 0.95
      n: 10  # == evolution.group_size (G); replay requires it
      tensor_model_parallel_size: 1
      checkpoint_engine:
        update_weights_bucket_megabytes: 4096
      gpu_memory_utilization: 0.38
      max_model_len: 12000
      max_num_batched_tokens: 12000
      dtype: bfloat16
      enable_chunked_prefill: true
      enforce_eager: false
      free_cache_engine: false
      enable_sleep_mode: false
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 4

  # Inert under algorithm.adv_estimator: grpo -- verl's need_critic() returns
  # False for anything but gae when critic.enable is unset, so no critic worker
  # is built and nothing below is read. Kept so switching back to gae works.
  critic:
    ppo_mini_batch_size: 32
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 2

  reward_model:
    enable: false
    reward_manager: naive

  reward:
    custom_reward_function:
      path: ./src/rq_evolve/reward.py
      name: compute_score
    reward_manager:
      source: register
      name: naive
    reward_model:
      enable: false

  algorithm:
    # GRPO with the group-std division removed (Dr.GRPO / RLOO form).
    # This is a CONSISTENCY condition for R_Q, not a tuning choice:
    # dividing by sqrt(Var[r]) 'removes the dependency of the expected
    # gradient magnitude on learnability' (LILO Thm 3.1), and our archive
    # fitness IS learnability (R_Q = L x U). Normalised, the curriculum
    # could pick perfectly and the solver's gradient would not notice.
    # Unnormalised, expected policy improvement is upper bounded by a
    # quantity increasing linearly with learnability. RLOO's advantage is
    # exactly k/(k-1) times this one, so the two differ only by a scale.
    # Only the std term is dropped; length normalisation stays at verl's
    # default loss_agg_mode.
    adv_estimator: grpo
    use_kl_in_reward: false
    kl_penalty: low_var_kl
    norm_adv_by_std_in_grpo: false

  trainer:
    total_epochs: 10000
    total_training_steps: 256
    project_name: rq_evolve
    experiment_name: qwen3_4b_rq_evolve_4gpu
    logger:
      - console
      - wandb
    nnodes: 1
    n_gpus_per_node: 4
    val_before_train: false
    test_freq: 32
    save_freq: 32
    # Keep EVERY checkpoint. The old policy (keep 1, with the launch shell
    # merging each 32-step actor/ to HF and then deleting only the actor)
    # silently failed on the 2026-08-23 run: no merge ran, verl deleted on
    # schedule, and the step-32/64/96 weights were lost unmerged. Deletion is
    # now nobody's job: merge on demand with scripts/merge_fsdp_to_hf.py and
    # remove an actor/ by hand only after its hf_merged/ exists.
    # Sizing: the 4B actor shards to ~47G per save. The auto-merge daemon the
    # launcher starts collapses every previous checkpoint to an ~8G hf_merged
    # and reclaims its actor/, so the steady state is one 47G actor plus 8x8G,
    # about 110G against 342G free.
    max_actor_ckpt_to_keep: null
    max_critic_ckpt_to_keep: null
    default_local_dir: ./rq_output/rq_evolve_4b_4gpu
    device: cuda
    resume_mode: auto

  ray_init:
    num_cpus: null
