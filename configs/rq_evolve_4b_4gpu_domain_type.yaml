# Fresh 4-GPU production run: Omni-MATH top-level DOMAIN x computational
# PROBLEM_TYPE.  The inherited file supplies the measured four-rank compute
# geometry; this file replaces the behavioural descriptors and mutation
# contract and gives the run its own, never-resumed identity.
extends: rq_evolve_4b_4gpu.yaml

evolution:
  seed_programs_dir: seed_programs_domain_type
  two_stage_mutation: true
  # Available after the step-64 evaluation; keep the live baseline fixed for
  # now. The refill controller is proposal-capped (32 minimum, 96 maximum) and
  # intentionally has no wall-time stop.
  adaptive_mutation_refill: true
  mutation_refill_max_iterations: 96
  mutation_refill_target_frontier_insertions: 1
  mutation_refill_target_frontier_candidates: 8
  archive_preflight_before_rollout: false
  # Local execution is cheap relative to solver rollouts. Sixteen deterministic
  # seeds include substantially more RNG edge cases than the historical five,
  # and the first process iteration re-audits any restored champions under the
  # current semantic/dataflow rules without invoking DOMAIN labeling early.
  verify_seeds: 16
  strict_champion_audit: true
  # Stage 1 is untargeted. Stage 2 compiles the fixed child family without a
  # DOMAIN. Seven local-policy YES/NO arms assign one domain afterwards;
  # PROBLEM_TYPE is derived locally from statement + verifier.
  target_cell_injection: false
  relabel_skill: false
  independent_domain_labeling: true
  domain_labeling_min_probability: 0.0
  domain_labeling_min_logit_margin: 0.0
  structural_inspiration: false
  ast_contract: enforce
  fix_retry: false

archive:
  require_domain_labeling: true
  domain_labeling_min_probability: 0.0
  domain_labeling_min_logit_margin: 0.0

verl_config:
  # Keep values used by the shell preflight explicit even though OmegaConf
  # resolves them through `extends` for the trainer.
  actor_rollout_ref:
    model:
      path: /data1/yhoon113/qwen3-4b-base
  trainer:
    n_gpus_per_node: 4
    project_name: rq_evolve
    experiment_name: qwen3_4b_domain_type_35cell_4gpu
    default_local_dir: ./rq_output/rq_evolve_4b_domain_type_35cell_4gpu
    # Never discover or reuse a GROUP x SKILL checkpoint/archive.
    resume_mode: disable
