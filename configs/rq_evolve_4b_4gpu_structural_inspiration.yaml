# Untargeted structural-inspiration arm over rq_evolve_4b_4gpu.yaml.
#
# Compare only with rq_evolve_4b_4gpu_structural_control.yaml, which shares the
# untargeted generation, deterministic prompt RNG and every current code path.
# The donor is sampled from another primary-parent lineage and only its
# parameterized problem skeleton enters stage 1; labels/source/answer/scores and
# the whole donor are absent from stage 2.
extends: rq_evolve_4b_4gpu.yaml
run_contract: untargeted_structural_inspiration_v1

evolution:
  structural_inspiration: true
  structural_inspiration_seed: 0
  mutation_prompt_seed: 0
  search_seed: 0
  structural_inspiration_max_chars: 1600
  structural_inspiration_selection: cross_lineage_random
  # Shinka-style random context: neither the donor nor a target-cell scheduler
  # orders the child toward a named GROUP/SKILL. Both axes are read back blind.
  target_cell_injection: false

verl_config:
  trainer:
    experiment_name: qwen3_4b_rq_evolve_4gpu_untargeted_structural_inspiration
    default_local_dir: ./rq_output/rq_evolve_4b_4gpu_untargeted_structural_inspiration
    # The directory is unique, so the first launch is fresh; later launches can
    # resume this same arm after interruption.
    resume_mode: auto
