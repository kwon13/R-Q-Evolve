# 4B on ALL EIGHT GPUs -- Ablation Arm: No Uncertainty (U := 1, R_Q = s(1-s)).
#
# Identical to rq_evolve_4b_8gpu.yaml in every hyperparameter (Two-Stage mutation,
# Self-Consistency skill gate, batch size, learning rate, 256 steps, test_freq 32)
# except:
#   1. select_ignores_uncertainty: true  -> Champions & training data ranked by s(1-s) alone.
#   2. experiment_name: qwen3_4b_rq_evolve_8gpu_ablate_nounc
#   3. default_local_dir: ./rq_output/rq_evolve_4b_8gpu_ablate_nounc

archive:
  epsilon: 0.3
  ucb_c: 1.0
  selection_strategy: random

evolution:
  seed_programs_dir: seed_programs
  inner_iterations: 32
  inner_iteration_batch_size: 32
  group_size: 10
  train_batch_target: 32
  # --- ABLATION: U := 1 (Ranked by s(1-s) alone) ---
  select_ignores_uncertainty: true
  select_ignores_variance: false
  verify_seeds: 5
  frontier_p_hat_range: [0.0, 1.0]

  fix_retry: false
  use_evaluator: false
  ast_contract: enforce
  evaluator_provider: policy

  two_stage_mutation: true
  stage2_skill_gate: true
  code_temperature: 0.4
  code_top_p: 0.95
  generator_temperature: 0.0
  generator_top_p: 1.0

training_data:
  replay_training_batch: true
  instances_per_program: 8
  training_budget: null
  strict_anti_reuse: true
  select_lowest_rq_first: false
  select_random_order: False
  select_random_seed: 0
  static_training_jsonl: null
  static_condition: null
  static_expected_rows: null
  static_expected_tokens: null
  static_epochs: 1

verl:
  enabled: true
  config_path: null
  reward_function: ./src/rq_evolve/reward.py:compute_score
  evolve_on_first_epoch: false

math_eval:
  enabled: true
  benchmarks: [math500, amc23, aime24, aime25, minerva_math, olympiadbench]
  max_samples_per_benchmark: -1
  sample_seed: 42
  inflate_x32: false
  grader: sympy

async_rollout:
  streaming_enabled: true
  chunk_size: 1
  max_in_flight_chunks: 32
  request_timeout_s: 900
  max_retries: 1
  verify_workers: 4
  queue_maxsize: 32
  staleness_mode: bounded
  max_policy_lag: 1
  log_samples: true
  entropy_mode: deferred

lora:
  enabled: false
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  sync_mode: auto

verl_config:
  data:
    max_prompt_length: 6000
    max_response_length: 5000
    train_batch_size: 32
    val_batch_size: 60000
    shuffle: true
    truncation: left
    dataloader_num_workers: 0
    filter_overlong_prompts: false
    trust_remote_code: true

  actor_rollout_ref:
    model:
      path: /data1/yhoon113/qwen3-4b-base
      trust_remote_code: true
      use_remove_padding: true
      enable_gradient_checkpointing: true

    actor:
      strategy: fsdp
      ppo_mini_batch_size: 32
      ppo_micro_batch_size: null
      ppo_micro_batch_size_per_gpu: 4
      use_dynamic_bsz: false
      entropy_from_logits_with_chunking: true
      use_kl_loss: true
      kl_loss_coef: 1.0e-3
      kl_loss_type: low_var_kl
      use_torch_compile: false
      fsdp_config:
        param_offload: false
        optimizer_offload: false
      optim:
        lr: 1.0e-6
        weight_decay: 1.0e-2
        lr_warmup_steps_ratio: 0.0
        total_training_steps: 256

    ref:
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 2
      fsdp_config:
        param_offload: true

    rollout:
      name: vllm
      mode: async
      temperature: 1.0
      top_p: 0.95
      n: 10  # == evolution.group_size (G); replay requires it
      tensor_model_parallel_size: 1
      checkpoint_engine:
        update_weights_bucket_megabytes: 4096
      gpu_memory_utilization: 0.38
      max_model_len: 12000
      max_num_batched_tokens: 12000
      dtype: bfloat16
      enable_chunked_prefill: true
      enforce_eager: false
      free_cache_engine: false
      enable_sleep_mode: false
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 2

  critic:
    ppo_mini_batch_size: 32
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 2

  reward_model:
    enable: false
    reward_manager: naive

  reward:
    custom_reward_function:
      path: ./src/rq_evolve/reward.py
      name: compute_score
    reward_manager:
      source: register
      name: naive
    reward_model:
      enable: false

  algorithm:
    adv_estimator: grpo
    use_kl_in_reward: false
    kl_penalty: low_var_kl
    norm_adv_by_std_in_grpo: false

  trainer:
    total_epochs: 10000
    total_training_steps: 256
    project_name: rq_evolve
    experiment_name: qwen3_4b_rq_evolve_8gpu_ablate_nounc
    logger:
      - console
      - wandb
    nnodes: 1
    n_gpus_per_node: 8
    val_before_train: false
    test_freq: 32
    save_freq: 32
    max_actor_ckpt_to_keep: null
    max_critic_ckpt_to_keep: null
    default_local_dir: ./rq_output/rq_evolve_4b_8gpu_ablate_nounc
    device: cuda
    resume_mode: auto

  ray_init:
    num_cpus: null
