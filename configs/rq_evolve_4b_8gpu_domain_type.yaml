# Fresh production run: Omni-MATH top-level DOMAIN x computational PROBLEM_TYPE.
# This file intentionally extends the proven 4B/8-GPU compute geometry while
# replacing the behavioural descriptors and mutation contract.
extends: rq_evolve_4b_8gpu.yaml

evolution:
  seed_programs_dir: seed_programs_domain_type
  two_stage_mutation: true
  # Keeps 32 as the minimum, samples in the existing 32-wide batches, and adds
  # at most three refill batches (64/96/128 proposals). There is no
  # hardware-dependent wall-time condition. A process that was started before
  # this edit remains unchanged.
  adaptive_mutation_refill: true
  mutation_refill_max_iterations: 128
  mutation_refill_target_frontier_insertions: 1
  mutation_refill_target_frontier_candidates: 8
  archive_preflight_before_rollout: false
  # Five deterministic seeds retain the cross-seed family/variation contract
  # without the 3.2x serial work of the earlier 16-seed setting. Candidate
  # families verify concurrently, while every candidate's seed order and
  # repeated-execution determinism check remain unchanged.
  verify_seeds: 5
  program_verify_workers: 8
  strict_champion_audit: true
  # Stage 1 receives no descriptor or destination. Stage 2 compiles the already
  # fixed child family and emits no DOMAIN. PROBLEM_TYPE is derived locally
  # from the rendered statement and declarative verifier, consistently over all
  # verify seeds. No separate evaluator model or external API is involved.
  target_cell_injection: false
  relabel_skill: false
  # Seven one-token, label-blind YES/NO calls read the fixed family with the
  # same local Qwen policy and directly assign its DOMAIN. Stage 2 emits no
  # DOMAIN. Keep top-1 assignment for coverage; confidence and margin remain
  # diagnostic signals rather than hard rejection thresholds.
  independent_domain_labeling: true
  domain_labeling_min_probability: 0.0
  domain_labeling_min_logit_margin: 0.0
  # Optional donor context remains label-free and is disabled for the first
  # clean run, isolating the new archive from the earlier inspiration study.
  structural_inspiration: false
  ast_contract: enforce
  fix_retry: false

archive:
  # Keep the production arm on occupied-cell uniform random selection. SW-MCE
  # remains implemented for a later controlled experiment, but is not active
  # in this training configuration.
  selection_strategy: random
  require_domain_labeling: true
  domain_labeling_min_probability: 0.0
  domain_labeling_min_logit_margin: 0.0

# Match the current 4-GPU replay contract. Without this override the older
# 8-GPU base leaves the frontier unbounded and an overfull (>32) frontier is
# effectively subsampled by dataloader order instead of previous raw R_Q.
training_data:
  training_budget: 32

verl_config:
  # The Python config loader resolves `extends` recursively.  The shell
  # launcher deliberately performs two cheap checks with grep before Python
  # starts, so repeat these inherited values here as well; otherwise it sees
  # an empty device/model value and refuses an otherwise valid launch.
  actor_rollout_ref:
    model:
      path: /data1/yhoon113/qwen3-4b-base
  trainer:
    n_gpus_per_node: 8
    project_name: rq_evolve
    experiment_name: qwen3_4b_domain_type_35cell_8gpu
    default_local_dir: ./rq_output/rq_evolve_4b_domain_type_35cell_8gpu
    # Never discover or reuse an earlier checkpoint/archive implicitly.
    resume_mode: disable
