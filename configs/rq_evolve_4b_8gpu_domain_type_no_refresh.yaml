# No-refresh ablation of the 4B DOMAIN x PROBLEM_TYPE production run (8 GPUs).
# All compute, mutation, archive, and replay settings are inherited unchanged;
# only seed_refresh is disabled so that problems are repeatedly evaluated and
# trained on seed 0.
extends: rq_evolve_4b_8gpu_domain_type.yaml

evolution:
  # Disable seed stream advancement: programs are evaluated and trained on seed 0.
  seed_refresh: false

verl_config:
  trainer:
    experiment_name: qwen3_4b_domain_type_no_refresh_35cell_8gpu
    default_local_dir: ./rq_output/rq_evolve_4b_domain_type_no_refresh_35cell_8gpu
    resume_mode: disable
