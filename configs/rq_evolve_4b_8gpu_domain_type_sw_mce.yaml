# Sliding-Window Monte Carlo Elites arm for the 35-cell DOMAIN x PROBLEM_TYPE
# production setup. Mutation, verification, fitness and archive competition are
# inherited unchanged; only reproductive parent selection differs.
extends: rq_evolve_4b_8gpu_domain_type.yaml

archive:
  # Cell-based MCE: exploitation is the recent binary archive-survival rate of
  # offspring. Filling an empty cell and replacing an incumbent both reward 1;
  # every other candidate outcome rewards 0.
  selection_strategy: sliding_window_mce
  ucb_c: 0.7071067811865475  # 1 / sqrt(2), as in Monte Carlo Elites
  # 50 outer iterations x 32 mutation attempts ~= 1,600 recent outcomes.
  mce_window_iterations: 50

verl_config:
  trainer:
    experiment_name: qwen3_4b_domain_type_35cell_8gpu_sw_mce
    default_local_dir: ./rq_output/rq_evolve_4b_domain_type_35cell_8gpu_sw_mce
    resume_mode: disable
