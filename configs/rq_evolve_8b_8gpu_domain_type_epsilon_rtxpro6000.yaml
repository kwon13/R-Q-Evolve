# Fresh 8B epsilon-admission arm, using the existing 96-GB RTX PRO 6000 geometry.
extends: rq_evolve_8b_8gpu_domain_type_rtxpro6000.yaml
run_contract: epsilon_admission_v1

archive:
  admission_strategy: epsilon_greedy
  admission_epsilon: ${oc.decode:${oc.env:RQ_ADMISSION_EPSILON,0.25}}

verl_config:
  actor_rollout_ref:
    model:
      path: ${oc.env:RQ_EPSILON_MODEL_PATH,Qwen/Qwen3-8B-Base}
  trainer:
    experiment_name: qwen3_8b_domain_type_epsilon_${archive.admission_epsilon}_35cell_8gpu_rtxpro6000
    default_local_dir: ./rq_output/rq_evolve_8b_domain_type_epsilon_${archive.admission_epsilon}_35cell_8gpu_rtxpro6000
    resume_mode: disable
