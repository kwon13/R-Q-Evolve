# Smoke test: ONE small training update with LoRA r32 + gradient checkpointing
# + FSDP on Qwen3-4B. Used by `python scripts/train_with_verl.py --config
# configs/rq_evolve_smoke_lora.yaml --smoke` (the --smoke flag additionally
# forces WANDB_MODE=offline and runs post-fit PASS/FAIL checks: fresh LoRA
# adapter checkpoint saved, rollout_samples.jsonl + rollout_metrics.jsonl
# written by THIS run). Adapter-only weight sync is NOT auto-checked -- confirm
# it by eye in the console: the first "vLLM load weights, loaded_params: N" is
# the full base push, subsequent ones must be small (adapter-only add_lora).
# Everything is sized to finish in minutes: 2 mutations, 4 rollouts each,
# 1 optimizer step, no benchmark eval.

archive:
  epsilon: 0.3
  ucb_c: 1.0
  selection_strategy: random

evolution:
  seed_programs_dir: seed_programs
  inner_iterations: 2
  inner_iteration_batch_size: 2
  num_rollouts: 4
  verify_seeds: 5
  frontier_p_hat_range: [0.0, 1.0]
  fix_retry: false
  use_evaluator: false        # skip the evaluator generate pass to keep it fast

training_data:
  instances_per_program: 4
  training_budget: null
  strict_anti_reuse: true

verl:
  enabled: true
  config_path: null
  reward_function: ./src/rq_evolve/reward.py:compute_score
  evolve_on_first_epoch: true # evolve immediately so step 1 has fresh data

math_eval:
  enabled: false              # no benchmark eval in the smoke run

async_rollout:
  streaming_enabled: true
  chunk_size: 1
  max_in_flight_chunks: 4
  request_timeout_s: 600
  max_retries: 1
  verify_workers: 2
  queue_maxsize: 16
  staleness_mode: bounded
  max_policy_lag: 1
  log_samples: true
  entropy_mode: deferred

lora:
  enabled: true
  rank: 32
  alpha: 64
  dropout: 0.05               # verl 0.7.1 legacy path: effective 0.0 (warned)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  sync_mode: auto             # Qwen3 is vLLM-LoRA capable -> native_adapter

verl_config:
  data:
    max_prompt_length: 6000
    max_response_length: 512  # short generations: smoke, not quality
    train_batch_size: 8
    val_batch_size: 8
    shuffle: true
    truncation: left
    dataloader_num_workers: 0
    filter_overlong_prompts: false
    trust_remote_code: true

  actor_rollout_ref:
    model:
      path: /data1/yhoon113/qwen3-4b-base
      trust_remote_code: true
      use_remove_padding: true
      enable_gradient_checkpointing: true

    actor:
      strategy: fsdp
      ppo_mini_batch_size: 8
      ppo_micro_batch_size: null
      ppo_micro_batch_size_per_gpu: 2
      use_dynamic_bsz: false
      use_kl_loss: true
      kl_loss_coef: 1.0e-3
      kl_loss_type: low_var_kl
      use_torch_compile: false
      fsdp_config:
        param_offload: false
        optimizer_offload: false
      optim:
        # LoRA-appropriate lr (full-FT runs use 1e-6; adapters train ~10x hotter)
        lr: 1.0e-5
        weight_decay: 1.0e-2
        lr_warmup_steps_ratio: 0.0
        total_training_steps: 1

    ref:
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 2
      fsdp_config:
        param_offload: true

    rollout:
      name: vllm
      mode: async
      temperature: 1.0
      top_p: 0.95
      n: 4
      tensor_model_parallel_size: 1
      checkpoint_engine:
        update_weights_bucket_megabytes: 4096
      gpu_memory_utilization: 0.45
      max_model_len: 8192
      max_num_batched_tokens: 8192
      dtype: bfloat16
      enable_chunked_prefill: true
      enforce_eager: false
      # sleep/wake stays DISABLED on this box (cumem allocator crash); weight
      # sync (full base on first push, adapter-only after) works regardless.
      free_cache_engine: false
      enable_sleep_mode: false
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 2

  critic:
    ppo_mini_batch_size: 8
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 2

  reward_model:
    enable: false
    reward_manager: naive

  reward:
    custom_reward_function:
      path: ./src/rq_evolve/reward.py
      name: compute_score
    reward_manager:
      source: register
      name: naive
    reward_model:
      enable: false

  algorithm:
    adv_estimator: rloo
    use_kl_in_reward: false
    kl_penalty: low_var_kl
    norm_adv_by_std_in_grpo: true

  trainer:
    total_epochs: 1
    total_training_steps: 1
    project_name: rq_evolve
    experiment_name: smoke_lora_r32
    logger:
      - console
      - wandb
    nnodes: 1
    n_gpus_per_node: 8
    val_before_train: false
    test_freq: -1
    save_freq: 1
    # Keep ONE checkpoint on disk (see rq_evolve_base.yaml for the sizing).
    max_actor_ckpt_to_keep: 1
    max_critic_ckpt_to_keep: 1
    default_local_dir: ./rq_output/smoke
    device: cuda
    resume_mode: disable      # smoke always starts fresh

  ray_init:
    num_cpus: null
